name: CI/CD

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Validate, Package & Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate themes and manifests
        run: node scripts/validate.js

      - name: Package extension zips
        run: bash scripts/build.sh

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vesper-chromium-themes
          path: dist/*.zip
          retention-days: 90

      - name: Publish to GitHub Releases
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./dark/manifest.json').version")
          TAG="v$VERSION"
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${{ github.ref_name }}"
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists — updating release assets..."
            gh release upload "$TAG" dist/*.zip --clobber
          else
            echo "Creating release $TAG..."
            gh release create "$TAG" dist/*.zip \
              --title "Vesper $TAG" \
              --generate-notes
          fi
